name: BMC Message Auto Dispatcher

on:
  schedule:
    # 生日模式觸發（台灣時間 8/14 00:00 ~ 8/15 00:00，相當於 UTC 8/13 16:00 ~ 8/14 16:00）
    - cron: '0 16-23 13 8 *'  # 台灣時間 8/14 00:00 - 07:00 (每小時整點)
    - cron: '0 0-16 14 8 *'   # 台灣時間 8/14 08:00 - 8/15 00:00 (每小時整點)

    # 日常模式觸發（每小時 7, 24, 46 分隨機發送）
    - cron: '7,24,46 * * * *'

  workflow_dispatch: # 保留手動觸發功能

jobs:
  send_message:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Send Webhook
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # 取得當前 UTC 時間
          UTC_MONTH=$(date -u +%m)
          UTC_DAY=$(date -u +%d)
          UTC_HOUR=$(date -u +%H)

          # 判斷是否處於 8/14 生日活動期間
          IS_BIRTHDAY=false
          if [ "$UTC_MONTH" = "08" ]; then
            if [ "$UTC_DAY" = "13" ] && [ "$UTC_HOUR" -ge 16 ]; then
              IS_BIRTHDAY=true
            elif [ "$UTC_DAY" = "14" ] && [ "$UTC_HOUR" -le 16 ]; then
              IS_BIRTHDAY=true
            fi
          fi

          # ---------------------------------------------------------
          # 檔案與發送邏輯分流
          # ---------------------------------------------------------
          if [ "$IS_BIRTHDAY" = "true" ]; then
            TARGET_FILE="birthday.txt"
            echo "🎂 當前為【須王芦佳生日模式】，讀取檔案：$TARGET_FILE"

            if [ ! -f "$TARGET_FILE" ]; then
              echo "Error: $TARGET_FILE not found!"
              exit 1
            fi

            # 讀取並過濾非空行
            mapfile -t LINES < <(grep -v '^$' "$TARGET_FILE")
            TOTAL_LINES=${#LINES[@]}

            # 取得歷史進度 (紀錄於 birthday_index.txt)
            INDEX=0
            if [ -f birthday_index.txt ]; then
              INDEX=$(cat birthday_index.txt)
            fi

            # 索引超出總行數時自動歸零
            if [ "$INDEX" -ge "$TOTAL_LINES" ]; then
              INDEX=0
            fi

            SELECTED_LINE="${LINES[$INDEX]}"
            NEXT_INDEX=$((INDEX + 1))

          else
            TARGET_FILE="messages.txt"
            echo "🎲 當前為【日常模式】，讀取檔案：$TARGET_FILE"

            if [ ! -f "$TARGET_FILE" ]; then
              echo "Error: $TARGET_FILE not found!"
              exit 1
            fi

            # 日常模式：隨機抽取一行
            SELECTED_LINE=$(grep -v '^$' "$TARGET_FILE" | shuf -n 1)
          fi

          # 檢查抽取結果
          if [ -z "$SELECTED_LINE" ]; then
            echo "Error: Selected line is empty!"
            exit 1
          fi

          # 解析 JSON 內容
          NAME=$(echo "$SELECTED_LINE" | jq -r '.username')
          AVATAR=$(echo "$SELECTED_LINE" | jq -r '.avatar_url')
          MSG=$(echo "$SELECTED_LINE" | jq -r '.content')

          PAYLOAD=$(jq -n \
            --arg name "$NAME" \
            --arg avatar "$AVATAR" \
            --arg content "$MSG" \
            '{username: $name, avatar_url: $avatar, content: $content}')

          # 發送 Webhook (-f 參數保證發送失敗時中斷程式，不跳過角色)
          curl -f -H "Content-Type: application/json" \
               -X POST \
               -d "$PAYLOAD" \
               -sS "$WEBHOOK_URL"

          # 生日模式：發送成功後更新進度
          if [ "$IS_BIRTHDAY" = "true" ]; then
            echo "$NEXT_INDEX" > birthday_index.txt
            echo "✅ 生日祝福發送成功 ($((INDEX + 1))/$TOTAL_LINES) - $NAME！下一次發送索引：$NEXT_INDEX"
          fi
